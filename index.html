<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoque Fertilizer - Live Inventory</title>
  
  <!-- Add to Home Screen (PWA) Links -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3256/3256083.png">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --warning: #f59e0b;
      --brand: #3b82f6;
      --row-bg: #0f172a;
      --row-bg-alt: #162032;
      --qty-color: #2dd4bf;
      --more-btn: #a3e635;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 1.5rem; max-width: 1200px; margin: auto; }

    /* Header & Login */
    header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem; }
    .logo-area { display: flex; flex-direction: column; gap: 4px; }
    .badge-container { display: flex; align-items: center; gap: 12px; }
    .badge { color: var(--text); font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .status { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--accent); background: rgba(16, 185, 129, 0.1); padding: 2px 8px; border-radius: 20px; font-weight: 600;}
    .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; display: inline-block; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; }
    
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.85rem;}
    .btn:hover { background: var(--row-bg); transform: translateY(-1px); }
    .btn-brand { background: var(--brand); color: white; border: none; }
    .btn-brand:hover { background: #2563eb; }
    .btn-danger { background: var(--danger); border: none; color: white;}
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.85rem; }

    /* Controls (Fixed scroll issue) */
    .controls { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 1.5rem; }
    @media (min-width: 768px) { .controls { grid-template-columns: 2fr 1fr 1fr 1fr; } }
    input, select { background: var(--row-bg); border: 1px solid var(--card-border); color: var(--text); padding: 0.75rem 1rem; border-radius: 8px; outline: none; width: 100%; font-size: 0.9rem; transition: border 0.2s; }
    input:focus, select:focus { border-color: var(--brand); }

    /* Main Grid & Public Card UI */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 1.2rem; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 1.5rem; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); border-color: #475569; }
    
    .card-header-main { display: flex; justify-content: space-between; align-items: flex-start; }
    .card-type { font-size: 0.75rem; color: var(--brand); text-transform: uppercase; margin-bottom: 0.5rem; font-weight: 800; letter-spacing: 0.08em; }
    .card-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.4rem; color: #fff; line-height: 1.2;}
    .card-details { font-size: 0.85rem; color: #cbd5e1; line-height: 1.6; }
    
    .card-info-right { display: flex; flex-direction: column; align-items: flex-end; text-align: right; min-width: 100px; }
    .total-qty-label { color: var(--qty-color); font-size: 0.95rem; font-weight: 500; }
    .total-qty-value { color: var(--qty-color); font-size: 1.4rem; font-weight: 700; margin-top: 2px; }
    
    .card-footer-main { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 0.8rem; }
    .more-details-btn { background: none; border: none; color: var(--more-btn); font-size: 1rem; cursor: pointer; padding: 0; font-weight: 500; text-decoration: none; }
    .more-details-btn:hover { text-decoration: underline; }
    .last-updated { font-size: 0.75rem; color: #64748b; font-style: italic; }

    /* Hidden Admin/Stock Area */
    .variant-list { flex-direction: column; gap: 12px; margin-top: 1rem; border-top: 1px solid var(--card-border); padding-top: 1rem; }
    .variant-row { background: var(--row-bg); padding: 0.8rem; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--card-border); }
    .v-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
    .v-size { font-weight: 700; color: #fff; font-size: 1.05rem; }
    .v-packinfo { font-size: 0.8rem; color: var(--text-muted); background: var(--card-bg); padding: 2px 8px; border-radius: 12px; }
    .v-price { color: var(--accent); font-weight: 700; }
    
    .v-stock-area { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; background: var(--row-bg-alt); padding: 8px; border-radius: 6px; }
    .stock-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .stock-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em;}
    
    .qty-controls { display: flex; align-items: center; gap: 6px; }
    .qty-btn { background: #334155; color: white; border: none; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-weight: bold; display: none; align-items: center; justify-content: center; font-size: 1.1rem; line-height: 1;}
    .qty-btn:hover { background: var(--brand); }
    .qty-number { min-width: 25px; text-align: center; font-weight: 700; cursor: pointer; padding: 2px 4px; border-radius: 4px; font-size: 0.95rem; }
    .qty-number:hover { background: rgba(255,255,255,0.1); }
    
    .v-total-vol { font-weight: 800; color: var(--brand); font-size: 1rem; text-align: right; background: #0f172a; padding: 6px 10px; border-radius: 6px; border: 1px solid #1e293b;}
    
    .admin-tools { display: none; width: 100%; justify-content: flex-end; gap: 8px; margin-top: 10px; border-top: 1px solid var(--card-border); padding-top: 10px;}

    .low-stock-text { color: var(--warning); }
    .out-stock-text { color: var(--danger); }

    /* Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(11, 17, 32, 0.85); backdrop-filter: blur(4px); align-items: flex-start; justify-content: center; padding: 2rem 1rem; z-index: 100; overflow-y: auto; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); padding: 2rem; border-radius: 12px; width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); margin-bottom: 2rem; }
    .modal-content h3 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    .modal-content label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: -10px; }
    
    .variant-builder { display: flex; flex-direction: column; gap: 12px; margin-top: 0.5rem; }
    .vb-group { background: var(--bg); border: 1px solid var(--card-border); padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
    .vb-row-top { display: grid; grid-template-columns: 2fr 1fr 1.5fr; gap: 10px; }
    .vb-row-bottom { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: center; }
    .vb-group input { padding: 0.6rem; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <div class="badge-container">
        <p class="badge">Hoque Fertilizer</p>
        <div class="status"><span class="dot"></span> Live Sync</div>
      </div>
      <h1>Inventory Stock Board</h1>
    </div>
    <div class="header-actions">
      <button class="btn btn-brand" id="add-item-btn" style="display:none;" onclick="window.openModal()">+ Add Product</button>
      <button class="btn" id="login-btn" onclick="window.toggleBossMode()">LOGIN</button>
    </div>
  </header>

  <div class="controls">
    <input type="text" id="search" placeholder="🔍 Search product or chemical..." oninput="window.renderItems()">
    <select id="type-filter" onchange="window.renderItems()"><option value="all">All Categories</option></select>
    <select id="company-filter" onchange="window.renderItems()"><option value="all">All Brands</option></select>
    <select id="tech-filter" onchange="window.renderItems()"><option value="all">All Chemicals</option></select>
  </div>

  <div class="grid" id="product-grid"></div>

  <!-- Modal for Adding/Editing -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <h3 id="modal-title">Add / Edit Product</h3>
      <input type="hidden" id="edit-id">
      
      <label>Product Name</label>
      <input type="text" id="item-name" placeholder="e.g. Coragen">
      
      <label>Brand / Company (Optional)</label>
      <input type="text" id="item-company" placeholder="e.g. FMC, Bayer, Dehaat">
      
      <label>Chemical Composition / Technical (Optional)</label>
      <input type="text" id="item-tech" placeholder="e.g. Chlorantraniliprole 18.5% SC">
      
      <label>Category (Optional)</label>
      <input type="text" id="item-type" list="type-options" placeholder="Select or type custom">
      <datalist id="type-options">
        <option value="Insecticide"><option value="Herbicide"><option value="Fungicide">
        <option value="PGR"><option value="Fertilizer"><option value="Seeds">
      </datalist>

      <label style="margin-top: 10px;">Advanced Packing Sizes & Stock</label>
      <div class="variant-builder" id="variant-builder-container"></div>
      <button class="btn btn-brand btn-sm" style="align-self: flex-start;" onclick="window.addVariantFormRow()">+ Add Another Packing Size</button>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; border-top: 1px solid var(--card-border); padding-top: 15px;">
        <button class="btn btn-danger" onclick="window.closeModal()">Cancel</button>
        <button class="btn" onclick="window.saveItem()">Save Product</button>
      </div>
    </div>
  </div>

  <!-- FIREBASE INTEGRATION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkhcHgBs1-TB2bJHEvPXzNFwVNxfWTeNo",
      authDomain: "h-fert.firebaseapp.com",
      databaseURL: "https://h-fert-default-rtdb.firebaseio.com",
      projectId: "h-fert",
      storageBucket: "h-fert.firebasestorage.app",
      messagingSenderId: "339376459990",
      appId: "1:339376459990:web:21443faf6f8a7851eff977",
      measurementId: "G-GF4W6GFFWC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const inventoryRef = ref(db, 'inventory');

    const BOSS_PIN = "Jeke@1234"; 
    let isBossMode = false;
    let items = [];

    onValue(inventoryRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        items = Array.isArray(data) ? data : Object.values(data);
      } else {
        items = [];
      }
      window.renderItems();
    });

    function saveToStorage() { 
      set(inventoryRef, items);
    }

    window.toggleBossMode = function() {
      if (!isBossMode) {
        const pin = prompt("Enter Admin Password:");
        if (pin === BOSS_PIN) {
          isBossMode = true;
          document.getElementById('login-btn').innerText = "LOGOUT";
          document.getElementById('add-item-btn').style.display = "inline-flex";
        } else if (pin !== null) alert("Incorrect Password");
      } else {
        isBossMode = false;
        document.getElementById('login-btn').innerText = "LOGIN";
        document.getElementById('add-item-btn').style.display = "none";
      }
      window.renderItems();
    }

    window.toggleDetails = function(id) {
      const detailsDiv = document.getElementById(`details-${id}`);
      const btn = document.getElementById(`btn-toggle-${id}`);
      
      if (detailsDiv.style.display === 'flex') {
        detailsDiv.style.display = 'none';
        btn.innerText = 'More details';
      } else {
        detailsDiv.style.display = 'flex';
        btn.innerText = 'Hide details';
      }
    }

    function updateFilters() {
      const typeFilter = document.getElementById('type-filter');
      const companyFilter = document.getElementById('company-filter');
      const techFilter = document.getElementById('tech-filter');

      const currentType = typeFilter.value;
      const currentCompany = companyFilter.value;
      const currentTech = techFilter.value;

      const types = [...new Set(items.map(i => i.type))].filter(Boolean).sort();
      const companies = [...new Set(items.map(i => i.company))].filter(Boolean).sort();
      const techs = [...new Set(items.map(i => i.technical))].filter(Boolean).sort();

      const buildOptions = (arr, defaultLabel) => `<option value="all">${defaultLabel}</option>` + arr.map(a => `<option value="${a}">${a}</option>`).join('');

      typeFilter.innerHTML = buildOptions(types, 'All Categories');
      companyFilter.innerHTML = buildOptions(companies, 'All Brands');
      techFilter.innerHTML = buildOptions(techs, 'All Chemicals');

      if (types.includes(currentType)) typeFilter.value = currentType;
      if (companies.includes(currentCompany)) companyFilter.value = currentCompany;
      if (techs.includes(currentTech)) techFilter.value = currentTech;
    }

    function calculateTotalVolume(sizeStr, totalPieces) {
        if (!sizeStr || totalPieces === 0) return "0";
        const match = sizeStr.toLowerCase().replace(/\s/g, '').match(/([\d.]+)(ml|l|ltr|g|kg)/);
        if (!match) return totalPieces + " Pcs"; 
        let value = parseFloat(match[1]);
        let unit = match[2];
        let totalVal = value * totalPieces;

        if (unit === 'ml') {
            return totalVal >= 1000 ? (totalVal / 1000).toFixed(2) + " Ltr" : totalVal + " ml";
        } else if (unit === 'l' || unit === 'ltr') {
            return totalVal.toFixed(2) + " Ltr";
        } else if (unit === 'g') {
            return totalVal >= 1000 ? (totalVal / 1000).toFixed(2) + " Kg" : totalVal + " g";
        } else if (unit === 'kg') {
            return totalVal.toFixed(2) + " Kg";
        }
        return totalPieces + " Pcs";
    }

    function calculateGrandTotalVolume(variants) {
        if (!variants || variants.length === 0) return "0 L/Kg";

        let totalMl = 0;
        let totalGrams = 0;
        let totalPcsOnly = 0;
        let hasVolume = false;
        let hasWeight = false;

        variants.forEach(v => {
            let cQty = parseInt(v.caseQty) || 0;
            let lQty = parseInt(v.looseQty) || 0;
            let pOf = parseInt(v.packOf) || 1;
            let totalPcs = (cQty * pOf) + lQty;

            if (totalPcs === 0) return;

            const match = (v.size || "").toLowerCase().replace(/\s/g, '').match(/([\d.]+)(ml|l|ltr|g|kg)/);
            
            if (match) {
                let val = parseFloat(match[1]);
                let unit = match[2];
                if (unit === 'ml') { totalMl += (val * totalPcs); hasVolume = true; }
                else if (unit === 'l' || unit === 'ltr') { totalMl += (val * 1000 * totalPcs); hasVolume = true; }
                else if (unit === 'g') { totalGrams += (val * totalPcs); hasWeight = true; }
                else if (unit === 'kg') { totalGrams += (val * 1000 * totalPcs); hasWeight = true; }
            } else {
                totalPcsOnly += totalPcs;
            }
        });

        let results = [];
        if (hasVolume) {
            if (totalMl >= 1000) results.push((totalMl / 1000).toFixed(2).replace(/\.00$/, '') + "L");
            else results.push(totalMl + "ml");
        }
        if (hasWeight) {
            if (totalGrams >= 1000) results.push((totalGrams / 1000).toFixed(2).replace(/\.00$/, '') + "Kg");
            else results.push(totalGrams + "g");
        }
        
        if (results.length === 0 && totalPcsOnly === 0) return "0";
        if (results.length === 0) return totalPcsOnly + " Pcs";
        
        return results.join(" + ");
    }

    function normalizeStock(v) {
        let packOf = parseInt(v.packOf) || 1;
        if (packOf <= 0) packOf = 1; 
        let cQty = parseInt(v.caseQty) || 0;
        let lQty = parseInt(v.looseQty) || 0;
        let totalPieces = (cQty * packOf) + lQty;
        if (totalPieces < 0) totalPieces = 0;
        v.caseQty = Math.floor(totalPieces / packOf);
        v.looseQty = totalPieces % packOf;
    }

    window.adjustStock = function(productId, vIndex, type, amount) {
      if (!isBossMode) return;
      const product = items.find(i => i.id === productId);
      if (product && product.variants && product.variants[vIndex]) {
        let v = product.variants[vIndex];
        if (type === 'case') {
            v.caseQty = (parseInt(v.caseQty) || 0) + amount;
        } else if (type === 'loose') {
            v.looseQty = (parseInt(v.looseQty) || 0) + amount;
        }
        normalizeStock(v);
        product.lastUpdated = Date.now(); // Record Timestamp
        saveToStorage();
      }
    }

    window.manualStockEntry = function(productId, vIndex, type) {
      if (!isBossMode) return;
      const product = items.find(i => i.id === productId);
      if (product && product.variants && product.variants[vIndex]) {
        let v = product.variants[vIndex];
        let current = type === 'case' ? (v.caseQty || 0) : (v.looseQty || 0);
        let promptText = type === 'case' ? `Enter full ${v.packType}s:` : `Enter loose pieces:`;
        
        let input = prompt(promptText, current);
        if (input !== null && input.trim() !== "") {
          if (type === 'case') v.caseQty = parseInt(input) || 0;
          if (type === 'loose') v.looseQty = parseInt(input) || 0;
          normalizeStock(v);
          product.lastUpdated = Date.now(); // Record Timestamp
          saveToStorage();
        }
      }
    }

    window.renderItems = function() {
      updateFilters(); 
      const grid = document.getElementById('product-grid');
      const search = document.getElementById('search').value.toLowerCase();
      const fType = document.getElementById('type-filter').value;
      const fCompany = document.getElementById('company-filter').value;
      const fTech = document.getElementById('tech-filter').value;
      
      grid.innerHTML = '';

      const filtered = items.filter(item => {
        const matchesSearch = (item.name || "").toLowerCase().includes(search) || (item.technical || "").toLowerCase().includes(search);
        const matchesType = fType === 'all' || item.type === fType;
        const matchesCompany = fCompany === 'all' || item.company === fCompany;
        const matchesTech = fTech === 'all' || item.technical === fTech;
        return matchesSearch && matchesType && matchesCompany && matchesTech;
      });

      filtered.sort((a, b) => {
          const stockA = (a.variants || []).reduce((sum, v) => sum + ((parseInt(v.caseQty) || 0) * (parseInt(v.packOf) || 1)) + (parseInt(v.looseQty) || 0), 0);
          const stockB = (b.variants || []).reduce((sum, v) => sum + ((parseInt(v.caseQty) || 0) * (parseInt(v.packOf) || 1)) + (parseInt(v.looseQty) || 0), 0);

          if ((stockA === 0) !== (stockB === 0)) return stockA === 0 ? 1 : -1; 
          return (a.name || "").localeCompare(b.name || "");
      });

      filtered.forEach(item => {
        
        let grandTotalVolumeText = calculateGrandTotalVolume(item.variants);
        
        // Calculate raw pieces for the Stock Badge
        let rawTotalPieces = 0;
        let variantsHTML = (item.variants || []).map((v, index) => {
          let cQty = parseInt(v.caseQty) || 0;
          let lQty = parseInt(v.looseQty) || 0;
          let pOf = parseInt(v.packOf) || 1;
          let totalPcs = (cQty * pOf) + lQty;
          
          rawTotalPieces += totalPcs;
          
          let totalVol = calculateTotalVolume(v.size, totalPcs);
          let colorClass = totalPcs === 0 ? "out-stock-text" : (totalPcs < pOf ? "low-stock-text" : "");

          return `
            <div class="variant-row">
              <div class="v-header">
                <div>
                    <span class="v-size">${v.size || 'N/A'}</span>
                    <span class="v-packinfo">Pack of ${pOf} / ${v.packType || 'ctn'}</span>
                </div>
                <span class="v-price">₹${v.price || 0}</span>
              </div>
              
              <div class="v-stock-area">
                <div class="stock-box">
                  <span class="stock-label">Full ${v.packType || 'Ctn'}</span>
                  <div class="qty-controls">
                    <button class="qty-btn" style="display: ${isBossMode ? 'flex' : 'none'};" onclick="window.adjustStock(${item.id}, ${index}, 'case', -1)">-</button>
                    <span class="qty-number ${cQty === 0 ? 'out-stock-text' : ''}" onclick="window.manualStockEntry(${item.id}, ${index}, 'case')">${cQty}</span>
                    <button class="qty-btn" style="display: ${isBossMode ? 'flex' : 'none'};" onclick="window.adjustStock(${item.id}, ${index}, 'case', 1)">+</button>
                  </div>
                </div>
                
                <div class="stock-box">
                  <span class="stock-label">Loose Pcs</span>
                  <div class="qty-controls">
                    <button class="qty-btn" style="display: ${isBossMode ? 'flex' : 'none'};" onclick="window.adjustStock(${item.id}, ${index}, 'loose', -1)">-</button>
                    <span class="qty-number ${lQty === 0 && cQty === 0 ? 'out-stock-text' : ''}" onclick="window.manualStockEntry(${item.id}, ${index}, 'loose')">${lQty}</span>
                    <button class="qty-btn" style="display: ${isBossMode ? 'flex' : 'none'};" onclick="window.adjustStock(${item.id}, ${index}, 'loose', 1)">+</button>
                  </div>
                </div>

                <div class="v-total-vol ${colorClass}" title="Calculated Quantity">
                  ${totalVol}
                </div>
              </div>
            </div>
          `;
        }).join('');

        if(!item.variants || item.variants.length === 0) {
            variantsHTML = `<div class="variant-row" style="color:var(--text-muted); font-style:italic;">No packing sizes listed</div>`;
        }

        // Generate Warning Badges
        let stockBadge = "";
        if (rawTotalPieces === 0) {
            stockBadge = `<div style="background: var(--danger); color: white; font-size: 0.65rem; padding: 3px 8px; border-radius: 12px; font-weight: 800; display: inline-block; margin-bottom: 6px;">OUT OF STOCK</div>`;
        } else if (rawTotalPieces <= 5) {
            stockBadge = `<div style="background: var(--warning); color: #000; font-size: 0.65rem; padding: 3px 8px; border-radius: 12px; font-weight: 800; display: inline-block; margin-bottom: 6px;">LOW STOCK</div>`;
        }

        // Format Last Updated Time
        let lastUpdatedText = "Never updated";
        if (item.lastUpdated) {
            let d = new Date(item.lastUpdated);
            lastUpdatedText = `Updated: ${d.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true })}`;
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header-main">
            <div class="card-info-left">
              ${stockBadge}
              ${item.type ? `<div class="card-type" style="margin-top: ${stockBadge ? '2px' : '0'}">${item.type}</div>` : ''}
              <div class="card-title">${item.name || 'Unnamed Product'}</div>
              <div class="card-details">
                ${item.company ? `<div>🏢 ${item.company}</div>` : ''}
                ${item.technical ? `<div style="margin-top: 4px;">🧪 ${item.technical}</div>` : ''}
              </div>
            </div>
            
            <div class="card-info-right">
              <div class="total-qty-label">Total quantity</div>
              <div class="total-qty-value">${grandTotalVolumeText}</div>
            </div>
          </div>

          <div class="card-footer-main" style="display: ${isBossMode ? 'none' : 'flex'};">
             <div class="last-updated">🕒 ${lastUpdatedText}</div>
             <button class="more-details-btn" id="btn-toggle-${item.id}" onclick="window.toggleDetails(${item.id})">More details</button>
          </div>
          
          <div class="variant-list" id="details-${item.id}" style="display: ${isBossMode ? 'flex' : 'none'};">
             ${variantsHTML}
             
             <div class="admin-tools" style="display: ${isBossMode ? 'flex' : 'none'}; flex-wrap: wrap; justify-content: space-between; align-items: center;">
                <div class="last-updated" style="color: var(--text-muted);">🕒 ${lastUpdatedText}</div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-sm" onclick="window.editItem(${item.id})">Edit Config</button>
                    <button class="btn btn-danger btn-sm" onclick="window.deleteItem(${item.id})">Delete Item</button>
                </div>
             </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    window.addVariantFormRow = function(size = '', packOf = '', packType = 'ctn', price = '', caseQty = '', looseQty = '') {
      const container = document.getElementById('variant-builder-container');
      const group = document.createElement('div');
      group.className = 'vb-group';
      group.innerHTML = `
        <div class="vb-row-top">
            <input type="text" class="inp-size" placeholder="Size (e.g. 250ml, 1kg)" value="${size}">
            <input type="number" class="inp-packof" placeholder="Pack Of (e.g. 40)" value="${packOf}">
            <input type="text" class="inp-packtype" placeholder="Type (ctn/bag)" value="${packType}">
        </div>
        <div class="vb-row-bottom">
            <input type="number" class="inp-caseqty" placeholder="Cases" value="${caseQty}">
            <input type="number" class="inp-looseqty" placeholder="Loose Pcs" value="${looseQty}">
            <input type="number" class="inp-price" placeholder="Price (₹)" value="${price}">
            <button class="btn btn-danger btn-sm" style="padding: 0.6rem;" onclick="this.closest('.vb-group').remove()">X</button>
        </div>
      `;
      container.appendChild(group);
    }

    window.openModal = function(item = null) {
      document.getElementById('itemModal').style.display = 'flex';
      document.getElementById('variant-builder-container').innerHTML = ''; 
      
      if (item) {
        document.getElementById('modal-title').innerText = "Edit Product";
        document.getElementById('edit-id').value = item.id;
        document.getElementById('item-name').value = item.name || '';
        document.getElementById('item-company').value = item.company || '';
        document.getElementById('item-tech').value = item.technical || '';
        document.getElementById('item-type').value = item.type || '';
        
        if (item.variants && item.variants.length > 0) {
            item.variants.forEach(v => window.addVariantFormRow(v.size, v.packOf, v.packType, v.price, v.caseQty, v.looseQty));
        } else {
            window.addVariantFormRow();
        }
      } else {
        document.getElementById('modal-title').innerText = "Add New Product";
        document.getElementById('edit-id').value = "";
        document.getElementById('item-name').value = "";
        document.getElementById('item-company').value = "";
        document.getElementById('item-tech').value = "";
        document.getElementById('item-type').value = "";
        window.addVariantFormRow();
      }
    }

    window.closeModal = function() { document.getElementById('itemModal').style.display = 'none'; }

    window.saveItem = function() {
      const id = document.getElementById('edit-id').value;
      const name = document.getElementById('item-name').value.trim();
      const company = document.getElementById('item-company').value.trim();
      const technical = document.getElementById('item-tech').value.trim();
      const type = document.getElementById('item-type').value.trim();

      if (!name) {
          alert("Please provide at least a Product Name.");
          return;
      }

      let newVariants = [];
      document.querySelectorAll('.vb-group').forEach(group => {
          let vSize = group.querySelector('.inp-size').value.trim();
          let vPackOf = parseInt(group.querySelector('.inp-packof').value) || 1;
          let vPackType = group.querySelector('.inp-packtype').value.trim() || 'ctn';
          let vPrice = parseFloat(group.querySelector('.inp-price').value) || 0;
          let vCaseQty = parseInt(group.querySelector('.inp-caseqty').value) || 0;
          let vLooseQty = parseInt(group.querySelector('.inp-looseqty').value) || 0;
          
          if (vSize !== "") {
              let variant = { size: vSize, packOf: vPackOf, packType: vPackType, price: vPrice, caseQty: vCaseQty, looseQty: vLooseQty };
              normalizeStock(variant); 
              newVariants.push(variant);
          }
      });

      if (id) {
        const item = items.find(i => i.id == id);
        if (item) { 
            Object.assign(item, { name, company, technical, type, variants: newVariants, lastUpdated: Date.now() }); 
        }
      } else {
        items.unshift({ id: Date.now(), name, company, technical, type, variants: newVariants, lastUpdated: Date.now() });
      }

      saveToStorage();
      window.closeModal();
    }

    window.editItem = function(id) {
      const item = items.find(i => i.id === id);
      if (item) window.openModal(item);
    }

    window.deleteItem = function(id) {
      if (confirm("Delete this entire product and all its packing sizes permanently?")) {
        items = items.filter(i => i.id !== id);
        saveToStorage();
      }
    }

  </script>
</body>
</html>
